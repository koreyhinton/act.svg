<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia&display=swap" rel="stylesheet">
<style>
body {
    padding: 0;
    margin: 0;background-color:black;
}
table.activity-gameflow svg {
    background-color: #faf6f3;
}
table.activity-wireframe svg {
    background-color: lightgray;
}
table.entity-relationship-wireframe svg {
    background-color: #bcf5bc;
}
svg {
    color:black;width:66px;height:66px;
}
svg:hover {
    color:white;background-color:gray;font-weight:bold;cursor:pointer;
}
svg.active {
    color:black;background-color:#EEFFEE !important;font-weight:bold;
}
svg {
    padding:0;
    margin: 0;
    border-radius:5px;
}
table,tbody,tr,td{
    margin: 0;
    padding: 0;
}
td {
    padding-left:24px;
}
td {
    padding-top:7px;
}
td.title {
    vertical-align:bottom;
    padding-left: 0px;
}
td.title:hover {
    cursor: pointer;
}
button.palette-select-button {
    color: white;
    background-color: transparent;
    font-family: "Sofia", serif;
    font-weight: 400;
    font-style: normal;
    cursor: pointer;
    font-size: 10px;
    width: 60px;
    border: 0;
}
div.tdiv {
    margin: 0;
    padding: 0;
    border: 0;
    font-size: 100%;
    font: inherit;
    vertical-align: baseline;
}
span.theme {
    color: white;
    font-size: 10px;
}
span.palette {
    color: white;
    font-size: 14px;
}
span.theme-select-span button {
    color: white;
    background-color: transparent;
    font-family: "Sofia", serif;
    font-weight: 400;
    font-style: normal;
    cursor: pointer;
    font-size: 10px;
    border: 1px solid white;
}

span.theme-select-span button.active {
    color: black;
    background-color: white;
}
#palette-filename-drop-cap {
    font-family: Tinos, "Times New Roman";
}

#buttonbarTable {
    display: inline-block;
}

</style>
<script>

window.paletteDeck = {
    activeSlideId: 0,
    slide: () => {
        return window.paletteDeck.slides[window.paletteDeck.activeSlideId];
    },
    activeThemeId: 0,
    theme: () => {
        return window.paletteDeck.slide().themes[window.paletteDeck.activeThemeId];
    },
    slides: [
        {
            id: 0,
            name: "Activity",
            themes: [
                {
                    id: 0,
                    name: "Wireframe"
                },
                {
                    id: 1,
                    name: "Game flow"
                }
            ]
        },
        {
            id: 1,
            name: "Entity-Relationship",
            themes: [
                {
                    id: 0,
                    name: "Wireframe"
                }
            ]
        }
    ]
};

window.num = function(num) {
    window.parent.postMessage('num:'+num, '*');
    window.parent.focus();
}

/*window.addEventListener("DOMContentLoaded", function(e) {
    document.onkeydown = (e) => {
        e = e || window.event;
        if ("1234567890".indexOf(e.key) > -1) {
            window.parent.postMessage('key:'+e.key, '*');
            window.parent.focus();
            e.view.event.preventDefault();
        }
    };
});*/
window.onmessage = function(e) {
    var msgComponents = e.data.split(':');
    if (msgComponents.length >= 2 && msgComponents[0]=='num') {
        //var els = document.getElementsByTagName('svg');
        let tr = document.getElementsByTagName('tr')[0];
        let num = parseInt(msgComponents[1]);
        let idx = (num==0) ? 9 : num - 1;

        (tr.querySelector("svg.active"))
            /*<svg>*/
            .classList.remove('active');

        (tr.children[idx].querySelector("svg"))
            /*<svg>*/
            .classList.add('active');

        /*[...tr.children].forEach((td,i)=> {
            let svg = td.children[0];
            if (i ==idx) svg.classList.add('active');
            else svg.classList.remove('active');
        });*/

        /*for (var i=0; i<els.length; i++) {
            var el = els[i];
            if (el.innerHTML.indexOf(msgComponents[1]) > -1) {
                el.classList.add('active');
            }
            else {
                el.classList.remove('active');
            }
        }*/
    }
}

window.next = function(amt) {
    
    paletteDeck.activeSlideId = Math.abs(paletteDeck.slide().id + amt) % paletteDeck.slides.length;
    document.getElementById("palette").innerHTML = paletteDeck.slide().name;
    theme(0);
};

async function getXml() {
    let palette = paletteDeck.slide().name.toLowerCase();
    let theme = paletteDeck.theme().name.toLowerCase().replaceAll(' ', '');
    let xmlFilename = `./buttonbar-buttons/${palette}/${theme}.xml`;
    const response = await fetch(xmlFilename);
    const text = await response.text();
    return text;
}

window.theme = function(num) {

    // generate theme selection buttons

    paletteDeck.activeThemeId = num;
    document.getElementById("theme").innerHTML = paletteDeck.theme().name;
    let buttonHtml = "";
    for (var i=0; i<paletteDeck.slide().themes.length; i++) {
        var activeClass = i==num ? `class="active"` : "";
        buttonHtml += String.raw`<button ${activeClass} onclick="theme(${i})">o</button>`;
    }
    document.getElementById("theme-select").innerHTML = buttonHtml;

    // generate buttonbar mode buttons
    buttonbarTable();
};

const buttonbarTable = function(cmd) {
    if (cmd === "load") {
        addEventListener("DOMContentLoaded", _ => {
            buttonbarTable();
        });
        return;
    }

    var element = document.getElementById(buttonbarTable.name);
    (async () => {
        const xml = await getXml();
        var parser = new DOMParser();

        // table of svg buttons
        let paletteClassComponent = paletteDeck.slide().name.replace(' ', '').toLowerCase();
        let themeClassComponent = paletteDeck.theme().name.replace(' ', '').toLowerCase();
        let className = `${paletteClassComponent}-${themeClassComponent}`;

        var tableHtml = `<table class="${className}"><tbody><tr>`;
        var xmlDoc = parser.parseFromString(xml, 'text/xml');
        var svgs = xmlDoc.querySelector("svgs").children;
        for (var i=0; i<svgs.length; i++) {
            let mode = i == 10 ? 0 : i+1; // follows keyboard layout 1,2..9,0
            tableHtml += `<td onclick="num(${mode})">`;
            tableHtml += svgs[i].outerHTML;
            tableHtml += "</td>";
        }
        tableHtml += "</tr></tbody></table>";

        element.innerHTML = tableHtml;
    })();
};

</script>
</head>
<body onclick="window.parent.focus()">
<!--target will be _parent, also add stylesheet-->

<div id="buttonbarTable">
    <script>buttonbarTable('load');</script>
</div>

<div style="display: inline-block"><table><tbody><tr>
    <td style="width:110px">
        <div class="tdiv">
            <span class="palette" id="palette">Activity</span>
        </div>
        <div class="tdiv">
            <span class="theme" id="theme">Wireframe</span>
        </div>
        <div class="tdiv">
            <span class="theme-select-span" id="theme-select"><button class="active" onclick="theme(0)">o</button><button onclick="theme(1)">o</button></span>
        </div>
    </td>
    <td>
        <div class="tdiv">
            <button class="palette-select-button" onclick="next(-1)">/\</button>
        </div>
        <div class="tdiv">
            <button class="palette-select-button" onclick="next(1)">\/</button>
        </div>
    </td>
    <td class="title" onclick="window.top.location.href='index.html'"><a id="palette-filename-drop-cap" style="font-size:60px;position:relative;top:7px !important;color:white;">^</a><a id="palette-filename" style="text-decoration:underline;position:relative;left:-14px;top:-15px;color:white;">__ct.svg</a>
    </td>
</tr></tbody></table></div>
</body>
</html>
